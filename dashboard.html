<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{color-scheme:dark;--gold:#edc47b;--text:#f8f8fa;--muted:#a2aab9;--hair:rgba(240,209,151,.15)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:var(--text);font:13px/1.45 'Segoe UI Variable','Segoe UI',sans-serif;overflow:hidden}
#ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;border-radius:18px;background:radial-gradient(ellipse at 72% -15%,rgba(97,64,19,.40),transparent 44%),linear-gradient(160deg,#101b2c 0%,#0b1120 43%,#080d18 100%)}
#ambient:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,207,103,.025),transparent);pointer-events:none}
.ray{position:absolute;top:-130px;width:1px;height:var(--len);left:var(--x);opacity:var(--op);background:linear-gradient(0deg,transparent,rgba(255,200,108,.12),rgba(255,232,170,.76),transparent);box-shadow:0 0 8px 1px rgba(231,176,77,.24);animation:fall var(--dur) linear infinite;animation-delay:var(--delay)}
.orb{position:absolute;width:var(--size);height:var(--size);left:var(--x);top:var(--y);border-radius:50%;background:radial-gradient(circle,rgba(250,197,96,.34),rgba(200,131,40,.13) 30%,transparent 73%);filter:blur(8px);animation:float var(--dur) ease-in-out infinite alternate;opacity:var(--op)}
@keyframes fall{from{transform:translateY(-160px)}to{transform:translateY(1050px)}}@keyframes float{to{transform:translate(18px,-28px)}}
#shell{position:relative;width:100%;height:100%;border:1px solid rgba(234,201,143,.20);border-radius:17px;overflow:hidden;box-shadow:inset 0 1px rgba(255,255,255,.065)}
#scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:19px 22px 25px}#scroll::-webkit-scrollbar{display:none}
header{display:flex;align-items:center;gap:10px;margin-bottom:20px;min-height:27px}.mark{width:23px;height:25px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold)}.mark svg{width:19px;height:19px;display:block;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:drop-shadow(0 0 3px rgba(226,172,81,.20))}header strong{font-size:14px;letter-spacing:.15px}header button{margin-left:auto}
.iconbtn{width:31px;height:31px;min-width:31px;border:1px solid rgba(237,196,123,.24);border-radius:50%;background:rgba(255,255,255,.045);color:#cbd3dd;display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:0;flex-shrink:0}.iconbtn svg{width:14px;height:14px;display:block;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;fill:none}.iconbtn:hover{color:#fff!important;background:rgba(194,137,59,.23)!important;border-color:rgba(237,196,123,.55)!important}
.section{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:22px 0 10px}
.device{padding:15px 16px;background:rgba(158,171,200,.085);border:1px solid rgba(240,209,151,.18);border-radius:15px;margin-bottom:9px;cursor:pointer;transition:background .23s,border-color .23s,transform .23s;backdrop-filter:blur(14px)}.device:hover{background:rgba(172,183,205,.14);transform:translateY(-1px)}.device.selected{border-color:rgba(237,196,123,.60)}
.device-top{display:flex;justify-content:space-between;gap:8px}.device-name{font-weight:650}.state{font-size:11px;color:#78dfaa}.state.off{color:#a3a9b6}.level{font-size:23px;font-weight:700;letter-spacing:-.5px;margin:3px 0 9px}.bar{height:5px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}.bar span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#bf8c44,#ffe3a3);transition:width .5s}.sub{font-size:11px;color:var(--muted);margin-top:8px}
.empty{color:var(--muted);padding:14px 0 5px}.stat{font-size:11px;color:#a3adba;margin-top:11px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:46px}.setting>label:first-child{flex:1;max-width:230px}.setting .controls{display:flex;align-items:center;justify-content:flex-end;gap:11px;flex-shrink:0}
input[type=checkbox]{appearance:none;width:32px;height:18px;margin:0;position:relative;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.20);border-radius:999px;cursor:pointer;transition:background .2s}input[type=checkbox]:before{content:'';position:absolute;background:#ddd;top:2px;left:2px;width:12px;height:12px;border-radius:50%;transition:transform .2s}input[type=checkbox]:checked{background:#ad803f;border-color:#d6ad65}input[type=checkbox]:checked:before{transform:translateX(14px);background:white}
.threshold{display:flex;align-items:center;gap:12px}.threshold label{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px}.threshold input{width:25px;height:15px}.threshold input:before{width:9px;height:9px}.threshold input:checked:before{transform:translateX(10px)}
select,input[type=number]{font:inherit;color:#f4f4f7;background:rgba(255,255,255,.075);border:1px solid rgba(230,211,174,.19);border-radius:10px;height:34px;outline:0;padding:0 11px;transition:background .2s,border-color .2s}select:focus,input[type=number]:focus{border-color:var(--gold)}select{width:176px}option{background:#131b29}input[type=number]{width:91px;text-align:center;appearance:textfield}input::-webkit-inner-spin-button{opacity:.5}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}button{font-family:inherit;cursor:pointer;transition:transform .18s ease,background .18s,border-color .18s;white-space:nowrap}button:hover{transform:translateY(-1px);border-color:rgba(244,207,150,.6)!important;background:rgba(236,206,150,.17)!important}button:active{transform:translateY(0)}.pill{border:1px solid rgba(240,209,151,.20);border-radius:12px;background:rgba(255,255,255,.073);color:#eee;padding:9px 16px;min-width:116px}.pill.primary{background:linear-gradient(115deg,#956830,#b58746);border-color:rgba(244,219,157,.45);color:#fff}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tools .pill{width:100%;min-width:0}.tiny{font-size:11px;color:#cfa46c;min-height:16px;margin-top:8px}.foot{height:7px}
@media(prefers-reduced-motion:reduce){.ray,.orb{animation:none}*{transition:none!important}}
.device-actions{display:flex;gap:8px;align-items:center;margin-top:10px}.device-actions select{width:115px;height:30px}.insight-button{background:rgba(240,199,125,.12);border:1px solid rgba(240,199,125,.25);border-radius:8px;color:#f5dda9;padding:6px 12px}.estimate{display:block;font-size:11px;color:#d5c3a5;margin-top:7px}

body.compact .expanded{display:none}body.compact #scroll{max-height:440px}
.modebtn{margin-left:auto;border:1px solid rgba(224,187,115,.3);border-radius:20px;padding:6px 12px;background:rgba(28,33,48,.6);color:#e9cb8d;cursor:pointer}
.profile{display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(100px,auto);gap:9px;margin-top:12px;align-items:center;width:100%}.profile input.alias,.profile input.priority{width:100%;min-width:0;background:rgba(29,37,54,.65);border:1px solid #45495b;border-radius:9px;color:white;padding:7px}.notify-wrap{display:flex;align-items:center;justify-content:flex-end;gap:7px;white-space:nowrap;min-width:0}.notify-wrap label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#c5c8ce;cursor:pointer}.help-tip{display:inline-flex;align-items:center;justify-content:center;height:17px;width:17px;min-width:17px;border:1px solid rgba(237,196,123,.60);border-radius:50%;background:rgba(237,196,123,.10);color:#f5d49b;cursor:help;position:relative;box-sizing:border-box;line-height:0;padding:0;vertical-align:middle}.help-tip svg{width:11px;height:11px;display:block;overflow:visible;flex-shrink:0}.help-tip:hover::after,.help-tip:focus::after{content:attr(data-help);position:absolute;right:-7px;bottom:calc(100% + 12px);width:218px;white-space:normal;line-height:1.45;text-align:left;font-size:12px;font-weight:400;color:#f4f4f7;background:#1d2738;border:1px solid rgba(237,196,123,.48);border-radius:10px;padding:10px 12px;box-shadow:0 8px 26px rgba(0,0,0,.55);z-index:30;pointer-events:none}
</style></head><body><div id="ambient"></div><div id="shell"><div id="scroll"><header><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg></span><strong>BluetoothBatteryTray</strong><button class="modebtn" id="modeButton" onclick="toggleMode()">Compact</button><button class="iconbtn" onclick="send('close')" aria-label="Close" title="Close settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div class="section">Devices</div><div id="devices"></div><div class="stat" id="stats"></div><div class="expanded"><div class="section">Notifications & startup</div><div class="setting"><label>Low battery notifications</label><div class="controls"><input id="notifications" type="checkbox"/></div></div><div class="setting"><label>Notification thresholds</label><div class="controls threshold"><label><input id="a20" type="checkbox">20%</label><label><input id="a10" type="checkbox">10%</label><label><input id="a5" type="checkbox">5%</label></div></div><div class="setting"><label>Start with Windows</label><div class="controls"><input id="startup" type="checkbox"></div></div><div class="section">Appearance & displays</div><div class="setting"><label for="indicatorStyle">Battery indicator style</label><div class="controls"><select id="indicatorStyle"><option value="Percentage Only">Percentage Only</option><option value="Battery Icon + Percentage">Battery Icon + Percentage</option></select></div></div><div class="setting"><label>Refresh interval</label><div class="controls"><input id="poll" type="number" min="10" max="300"><span style="font-size:11px;color:#aab2bf">sec</span></div></div><div class="setting"><label>Secondary monitors</label><div class="controls"><input id="secondary" type="checkbox"></div></div><div class="actions"><button class="pill primary" id="saveButton" onclick="saveSettings()">Save settings</button><button class="pill" onclick="send('refresh')">Refresh now</button></div><div class="tiny" id="feedback"></div><div class="section">Quick actions</div><div class="tools"><button class="pill" onclick="send('history')">Battery history</button><button class="pill" onclick="send('export')">Export CSV</button><button class="pill" onclick="send('reset')">Reset positions</button><button class="pill" onclick="send('bluetooth')">Bluetooth settings</button><button class="pill" onclick="send('exit')">Exit application</button></div><div class="foot"></div></div></div></div><script>
const $=id=>document.getElementById(id);const send=(action,rest={})=>window.chrome?.webview?.postMessage({action,...rest});
// Startup and secondary display changes are committed together by Save settings.

let savedProfiles={};let compact=false;
function toggleMode(){compact=!compact;document.body.classList.toggle('compact',compact);$('modeButton').textContent=compact?'Expanded':'Compact';send('compact',{value:compact})}
function saveProfile(name,box){let alias=box.querySelector('.alias').value;let priority=+box.querySelector('.priority').value;let notify=box.querySelector('.notify').checked;send('profile',{name,alias,priority,notify});}
function saveSettings(){const button=document.getElementById('saveButton');if(button)button.disabled=true;send('save',{startup:$('startup').checked,secondary:$('secondary').checked,notifications:$('notifications').checked,alerts:[20,10,5].filter(n=>$('a'+n).checked),poll:+$('poll').value,width:62,weight:5,color:'Dynamic',indicatorStyle:$('indicatorStyle').value})}
function setSettings(s){if(typeof s.compact==='boolean'){compact=s.compact;document.body.classList.toggle('compact',compact);$('modeButton').textContent=compact?'Expanded':'Compact';}if(s.profiles)savedProfiles=s.profiles;$('notifications').checked=s.notifications;for(let n of [20,10,5])$('a'+n).checked=s.alerts.includes(n);$('poll').value=s.poll;$('indicatorStyle').value=s.indicatorStyle==='Battery Icon + Percentage'?'Battery Icon + Percentage':'Percentage Only';$('startup').checked=s.startup;$('secondary').checked=s.secondary}
function setDevices(s){let root=$('devices');root.replaceChildren();if(s.profiles)savedProfiles=s.profiles;if(!s.devices.length){let empty=document.createElement('div');empty.className='empty';empty.textContent='No reported battery levels. USB receivers may require a vendor SDK.';root.appendChild(empty)}for(const d of s.devices){let el=document.createElement('div');el.className='device'+(d.name===s.selected?' selected':'');el.dataset.name=d.name;let top=document.createElement('div');top.className='device-top';let name=document.createElement('span');name.className='device-name';name.textContent=d.name;let state=document.createElement('span');state.className='state'+(d.connected?'':' off');state.textContent=d.connected?'Battery reported':'Unavailable';top.append(name,state);let level=document.createElement('div');level.className='level';level.textContent=d.battery===null?'—':d.battery+'%';let bar=document.createElement('div');bar.className='bar';let fill=document.createElement('span');fill.style.width=(d.battery??0)+'%';bar.appendChild(fill);let diagnosis=document.createElement('div');diagnosis.className='sub';diagnosis.textContent=(d.connected?'Source: '+d.source:'Disconnected / Unknown battery')+' · Last reading: '+(d.lastSeen||'Never');
let details=document.createElement('div');details.className='device-actions';
let period=document.createElement('select');period.innerHTML='<option value="1">24 hours</option><option value="7">7 days</option><option value="30">30 days</option>';
let estimate=document.createElement('span');estimate.className='estimate';estimate.textContent='History: choose period';
period.onclick=e=>e.stopPropagation();period.onchange=e=>{e.stopPropagation();send('analytics',{name:d.name,days:+period.value})};
let info=document.createElement('button');info.className='insight-button';info.textContent='Insights';info.onclick=e=>{e.stopPropagation();send('analytics',{name:d.name,days:+period.value})};
details.append(period,info);
let profileData=savedProfiles[d.name]||{};
let prof=document.createElement('div');prof.className='profile';
prof.innerHTML='<input class="alias" maxlength="64" placeholder="Alias" aria-label="Device alias"><input class="priority" type="number" min="0" max="100" title="Device priority" aria-label="Device priority"><div class="notify-wrap"><label><input class="notify" type="checkbox" checked><span>Notify</span></label><span class="help-tip" tabindex="0" aria-label="Notification help" data-help="Enable or disable notifications for this device, including low battery and connection status alerts. Global notification settings still apply."><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v5.2" stroke="#f5d49b" stroke-width="1.9" stroke-linecap="round"/><circle cx="8" cy="12" r="1.05" fill="#f5d49b"/></svg></span></div>';
prof.querySelector('.alias').value=profileData.alias||'';prof.querySelector('.priority').value=profileData.priority||0;prof.querySelector('.notify').checked=profileData.notify!==false;
prof.onclick=e=>e.stopPropagation();prof.onchange=e=>{e.stopPropagation();saveProfile(d.name,prof)};
prof.querySelector('.alias').addEventListener('blur',()=>saveProfile(d.name,prof));
el.append(top,level,bar,diagnosis,details,estimate,prof);el.onclick=()=>send('select',{name:d.name});root.appendChild(el)}$('stats').textContent=s.devices.filter(x=>x.connected).length+' reporting · '+s.devices.length+' known · Updated '+s.updated}
window.chrome?.webview?.addEventListener('message',ev=>{let m=ev.data;if(m.type==='analytics'){for(const card of document.querySelectorAll('.device')){if(card.dataset.name!==m.name)continue;let st=m.stats;card.querySelector('.estimate').textContent=st.drainPerHour===null?'Insufficient discharge samples':('Average drain: '+st.drainPerHour+'%/hour · Estimated remaining: '+st.remainingHours+' hours · Samples: '+st.samples);}}if(m.type==='settings')setSettings(m);if(m.type==='devices')setDevices(m);if(m.type==='saved'){let b=$('saveButton');if(b)b.disabled=false;$('feedback').textContent='Settings saved';setTimeout(()=>$('feedback').textContent='',1800)}if(m.type==='error'){let b=$('saveButton');if(b)b.disabled=false;$('feedback').textContent='Save failed: '+m.message}});
// Decorative, deterministic golden rain drawn in ONE background layer (not per setting row).
let a=$('ambient');for(let i=0;i<37;i++){let e=document.createElement('i');e.className='ray';e.style.cssText=`--x:${(i*41.71)%100}%;--len:${18+(i*17)%100}px;--op:${.12+(i%8)*.055};--dur:${7+(i%11)}s;--delay:-${(i*3.7)%17}s`;a.appendChild(e)}for(let i=0;i<12;i++){let e=document.createElement('i');e.className='orb';e.style.cssText=`--x:${(i*29.2+11)%94}%;--y:${(i*31.7+4)%97}%;--size:${29+(i*11)%67}px;--op:${.22+(i%5)*.09};--dur:${5+i%7}s`;a.appendChild(e)}
</script></body></html>
